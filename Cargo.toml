[package]
name = "nomi"
version = "0.1.0"
edition = "2024"
description = "A small cross-platform terminal UI for batch-renaming files and directories."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
regex = "1.13.1"
thiserror = "2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"